# SonarQube Configuration
sonar.organization=wisl
sonar.projectKey=wislertt_bakefile
sonar.projectName=bakefile
sonar.projectVersion=1.0

# Source code settings
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/tests.py
sonar.exclusions=**/conftest.py,**/.templates/**,**/__pycache__/**,**/.venv/**,**/playground.py

# Python specific settings
sonar.python.version=3.14

# Coverage settings (if you generate coverage reports)
sonar.python.coverage.reportPaths=coverage.xml

# Code quality settings
sonar.qualitygate.wait=true

# Duplication exclusions
# Duplicate command signatures are required by Typer API
# - decorator.py stores kwargs for later registration (standalone @command decorator)
# - bakebook.py directly registers with Typer app (Bakebook.command() method)
# Both have identical signatures imposed by Typer's external API
sonar.cpd.exclusions=**/bakebook/decorator.py,**/bakebook/bakebook.py
