hash = "sha256:cba22b2aaf730eb559e1d83d984c96e87e74ead4d5d3115a5b6b198f55da658d"
editable.space_jobs = "    test:\n        uses: ./.github/workflows/test.yml\n        secrets:\n            SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}\n            CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}\n\n    pre-commit:\n        uses: ./.github/workflows/pre-commit.yml\n\n    publish-pypi:\n        needs: zerv-versioning\n        uses: ./.github/workflows/publish.yml\n        with:\n            version: ${{ fromJson(needs.zerv-versioning.outputs.versions).pep440 }}\n            python_version: \"3.15\"\n            registry: pypi\n        secrets:\n            PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}\n\n    publish-test-pypi:\n        needs: zerv-versioning\n        uses: ./.github/workflows/publish.yml\n        with:\n            version: ${{ fromJson(needs.zerv-versioning.outputs.versions).pep440 }}\n            python_version: \"3.15\"\n            registry: test-pypi\n            allow_fail: true # test-pypi is unreliable\n        secrets:\n            PYPI_API_TOKEN: ${{ secrets.TEST_PYPI_API_TOKEN }}\n"

