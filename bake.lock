[managed-content.".github/workflows/test.yml"]
template = "bakelib.space:test.yml"
hash = "sha256:a895be8d165ca7fb2cf5aa176d2884cf878ac20ba533aa9236906e4959033d8f"
editable.jobs = "    test-integration:\n        strategy:\n            fail-fast: false\n            matrix:\n                os: [ubuntu-latest, windows-latest, macos-latest]\n        runs-on: ${{ matrix.os }}\n        timeout-minutes: 30\n\n        steps:\n            - name: checkout\n              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1\n              with:\n                  fetch-depth: 0\n\n            - name: set-python-version\n              env:\n                  PYTHON_VERSION: ${{ inputs.target_python_version }}\n              run: echo \"$PYTHON_VERSION\" > .python-version\n\n            - name: setup-mise\n              uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0\n\n            - name: cache-venv\n              env:\n                  CACHE_KEY_PREFIX: venv-${{ github.workflow }}-${{ github.job }}-${{ runner.os }}\n                  CACHE_KEY_DEPS: ${{ hashFiles('uv.lock') }}\n              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0\n              with:\n                  path: |\n                      ~/.local/share/uv\n                      ~/.cache/uv\n                      ${{ github.workspace }}/.venv\n                  key: ${{ env.CACHE_KEY_PREFIX }}-${{ env.CACHE_KEY_DEPS }}-${{ github.run_id }}-${{ github.run_attempt }}\n                  restore-keys: |\n                      ${{ env.CACHE_KEY_PREFIX }}-${{ env.CACHE_KEY_DEPS }}-\n                      ${{ env.CACHE_KEY_PREFIX }}-\n\n            - name: install-dependencies\n              run: uv sync --all-extras --all-groups --frozen\n\n            - name: setup-path\n              shell: bash\n              run: |\n                  if [ \"$RUNNER_OS\" == \"Windows\" ]; then\n                      echo \"${{ github.workspace }}/.venv/Scripts\" >> \"$GITHUB_PATH\"\n                  else\n                      echo \"${{ github.workspace }}/.venv/bin\" >> \"$GITHUB_PATH\"\n                  fi\n\n            - name: run-integration-tests\n              run: bake test-integration\n"

