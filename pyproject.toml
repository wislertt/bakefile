[project]
name = "bakefile"
version = "0.0.0" # use git tag
description = "An OOP task runner. Write tasks once, reuse everywhere. Like a Makefile, but reusable and in Python."
readme = "README.md"
authors = [
  {name = "Wisaroot Lertthaweedech", email = "l.wisaroot@gmail.com"}
]
requires-python = ">=3.10"
license = "Apache-2.0"
keywords = ["automation", "build-tool", "cli", "makefile", "task-runner"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Utilities"
]
dependencies = [
  "beautysh>=6.4.2",
  "loguru>=0.7.3",
  "orjson>=3.11.5",
  "pydantic-settings>=2.0.0",
  "pydantic>=2.12.5",
  "python-dotenv>=1.2.1",
  "pyyaml>=6.0.3",
  "rich>=14.2.0",
  "ruff>=0.14.10",
  "tomli>=2.0.0; python_version < '3.11'",
  "ty>=0.0.8",
  "typer>=0.26.1",
  "typing-extensions>=4.12.0",
  "uv>=0.9.20"
]

[project.optional-dependencies]
# Exact pins for tool installs (uv tool / pipx / mise): `uv tool install
# "bakefile[locked]"`. Tested set, resolves reproducibly. Rewritten from
# uv.lock by `bake update`; keep pin >= base floor for every dep. To freeze
# a pin, add a trailing `# hold` comment to its line; `bake update` skips it.
locked = [
  "beautysh==6.4.3",
  "loguru==0.7.3",
  "orjson==3.12.0",
  "pydantic-settings==2.15.0",
  "pydantic==2.13.5",
  "python-dotenv==1.2.3",
  "pyyaml==6.0.3",
  "rich==15.0.0",
  "ruff==0.16.5",
  "tomli==2.4.1; python_version < '3.11'",
  "ty==0.0.75",
  "typer==0.27.2",
  "typing-extensions==4.16.0",
  "uv==0.12.7"
]
lib = [
  "keyring>=25.7.0",
  "pathspec>=1.0.3",
  "tenacity>=9.1.2",
  "zerv-version>=0.8.0"
]

[project.scripts]
bake = "bake.cli.bake:main"
bakefile = "bake.cli.bakefile:main"
bf = "bake.cli.bakefile:main"

[project.urls]
Changelog = "https://github.com/wislertt/bakefile/releases"
Documentation = "https://bakefile.wisl.dev"
Homepage = "https://bakefile.wisl.dev"
Issues = "https://github.com/wislertt/bakefile/issues"
Repository = "https://github.com/wislertt/bakefile"

[dependency-groups]
dev = [
  "deptry>=0.24.0",
  "packaging>=26.3",
  "pandas>=2.3.3",
  "pre-commit>=4.5.1",
  "pytest-cov>=7.0.0",
  "pytest>=9.0.2",
  "python-package",
  "toml-sort>=0.24.3",
  "tomlkit>=0.15.1"
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.deptry]
known_first_party = ["bake", "bakelib", "python_package"]
extend_exclude = ["scripts"]

[tool.deptry.package_module_name_map]
pydantic = ["pydantic", "pydantic_core"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
  "ARG",
  "B", # bugbear
  "C4", # flake8-comprehensions
  "E", # pycodestyle (error)
  "F", # pyflakes
  "I", # isort
  "N",
  "PGH", # pygrep-hooks
  "PIE", # flake8-pie
  "PYI", # flake8-pyi
  "RUF",
  "SIM", # flake8-simplify
  "UP" # pyupgrade
]

[tool.ty.src]
exclude = ["scripts"]

[tool.uv.build-backend]
module-name = ["bake", "bakelib"]
module-root = "src"

[[tool.uv.index]]
name = "test-pypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[tool.uv.sources]
python-package = {path = "examples/python-package", editable = true}

