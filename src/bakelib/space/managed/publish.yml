name: publish-python-package

on:
    workflow_call:
        inputs:
            version:
                required: true
                type: string
                description: "PEP440 version string"
            registry:
                required: false
                type: string
                description: "Publish registry (pypi or test-pypi)"
                default: "test-pypi"
            python_version:
                required: false
                type: string
                description: "Python version"
            allow_fail:
                required: false
                type: boolean
                description: "Allow publish to fail without failing the workflow"
                default: false
        secrets:
            PYPI_API_TOKEN:
                required: true

jobs:
    publish:
        runs-on: {% editable publish_runs_on %}ubuntu-latest{% endeditable %} # (editable)
        timeout-minutes: {% editable publish_timeout %}15{% endeditable %} # (editable)
        steps:
            - name: checkout
              # (editable) pin
              uses: actions/checkout@{% editable publish_checkout %}3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1{% endeditable %}

            - name: set-python-version
              env:
                  PYTHON_VERSION: ${{ inputs.python_version }}
              run: echo "$PYTHON_VERSION" > .python-version

            - name: setup-mise
              # (editable) pin
              uses: jdx/mise-action@{% editable publish_mise %}924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0{% endeditable %}

            - name: install-dependencies
              run: uv sync --all-extras --all-groups --frozen

            - name: setup-path
              run: echo "${{ github.workspace }}/.venv/bin" >> "$GITHUB_PATH"

            - name: publish
              continue-on-error: ${{ inputs.allow_fail }}
              env:
                  BAKE_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
                  REGISTRY: ${{ inputs.registry }}
                  VERSION: ${{ inputs.version }}
              run: bake publish --registry "$REGISTRY" --version "$VERSION"

            # (editable) more steps below
{% editable publish_steps %}
{% endeditable %}

    # (editable) more jobs below
{% editable jobs %}
{% endeditable %}
