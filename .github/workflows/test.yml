name: test

on:
    workflow_call:
        inputs:
            python_versions:
                type: string
                default: "['3.10', '3.11', '3.12', '3.13', '3.14']"
                description: "JSON array of Python versions to test"
            target_python_version:
                type: string
                default: "3.14"
                description: "Python version to use for coverage and SonarQube scans"
            upload_coverage:
                type: boolean
                default: true
                description: "Whether to upload coverage reports"
        secrets:
            SONAR_TOKEN:
                required: false
            CODECOV_TOKEN:
                required: false

jobs:
    test:
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest, macos-latest]
                python-version: ${{ fromJson(inputs.python_versions) }}
        runs-on: ${{ matrix.os }}

        steps:
            - name: checkout
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  fetch-depth: 0

            - name: set-python-version
              run: echo "${{ matrix.python-version }}" > .python-version

            - name: setup-mise
              uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1

            - name: cache-venv
              env:
                  CACHE_KEY_PREFIX: venv-${{ github.workflow }}-${{ github.job }}-${{ runner.os }}-py${{ matrix.python-version }}
                  CACHE_KEY_DEPS: ${{ hashFiles('uv.lock') }}
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: |
                      ~/.local/share/uv
                      ~/.cache/uv
                      ${{ github.workspace }}/.venv
                  key: ${{ env.CACHE_KEY_PREFIX }}-${{ env.CACHE_KEY_DEPS }}-${{ github.run_id }}-${{ github.run_attempt }}
                  restore-keys: |
                      ${{ env.CACHE_KEY_PREFIX }}-${{ env.CACHE_KEY_DEPS }}-${{ github.run_id }}-
                      ${{ env.CACHE_KEY_PREFIX }}-${{ env.CACHE_KEY_DEPS }}-
                      ${{ env.CACHE_KEY_PREFIX }}-

            - name: install-dependencies
              run: uv sync --all-extras --all-groups --frozen

            - name: setup-path
              shell: bash
              run: |
                  if [ "$RUNNER_OS" == "Windows" ]; then
                      echo "${{ github.workspace }}/.venv/Scripts" >> "$GITHUB_PATH"
                  else
                      echo "${{ github.workspace }}/.venv/bin" >> "$GITHUB_PATH"
                  fi

            - name: run-tests
              run: bake test

            - name: upload-coverage-reports-to-codecov
              if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
              uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
              with:
                  fail_ci_if_error: true
                  token: ${{ secrets.CODECOV_TOKEN }}
                  verbose: true

            - name: sonarqube-scan
              if: matrix.os == 'ubuntu-latest' && matrix.python-version == inputs.target_python_version && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
              uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
              env:
                  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
