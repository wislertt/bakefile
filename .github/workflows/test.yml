name: Reusable Test Workflow

on:
    workflow_call:
        inputs:
            python_versions:
                type: string
                default: "['3.10', '3.11', '3.12', '3.13', '3.14']"
                description: "JSON array of Python versions to test"
            target_python_version:
                type: string
                default: "3.14"
                description: "Python version to use for coverage and SonarQube scans"
            upload_coverage:
                type: boolean
                default: true
                description: "Whether to upload coverage reports"
        secrets:
            SONAR_TOKEN:
                required: false
            CODECOV_TOKEN:
                required: false

jobs:
    test:
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest, macos-latest]
                python-version: ${{ fromJson(inputs.python_versions) }}
        runs-on: ${{ matrix.os }}

        steps:
            - name: checkout
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  fetch-depth: 0

            - name: setup-mise
              uses: jdx/mise-action@6d1e696aa24c1aa1bcc1adea0212707c71ab78a8 # v3.6.1
            #   with:
            #       install_args: "python uv"
            #       tool_versions: |
            #           python ${{ matrix.python-version }}

            - name: debug
              run: |
                  echo "OS: $RUNNER_OS"
                  echo "Python version: ${{ matrix.python-version }}"
                  python --version
                  which python

            - name: cache-venv
              env:
                  CACHE_KEY_PREFIX: venv-${{ github.workflow }}-${{ github.job }}-${{ runner.os }}-py${{ matrix.python-version }}
                  CACHE_KEY_DEPS: ${{ hashFiles('uv.lock') }}
              uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
              with:
                  path: ${{ github.workspace }}/.venv
                  key: ${{ env.CACHE_KEY_PREFIX }}-${{ env.CACHE_KEY_DEPS }}-${{ github.run_id }}-${{ github.run_attempt }}
                  restore-keys: |
                      ${{ env.CACHE_KEY_PREFIX }}-${{ env.CACHE_KEY_DEPS }}-${{ github.run_id }}-
                      ${{ env.CACHE_KEY_PREFIX }}-${{ env.CACHE_KEY_DEPS }}-
                      ${{ env.CACHE_KEY_PREFIX }}-

            - name: install-dependencies
              run: uv sync --all-extras --all-groups --frozen

            - name: setup-path
              shell: bash
              run: |
                  if [ "$RUNNER_OS" == "Windows" ]; then
                      echo "${{ github.workspace }}/.venv/Scripts" >> $GITHUB_PATH
                  else
                      echo "${{ github.workspace }}/.venv/bin" >> $GITHUB_PATH
                  fi

            - name: run-tests
              run: bake test

            - name: upload-coverage-reports-to-codecov
              if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
              uses: codecov/codecov-action@671740ac38dd9b0130fbe1cec585b89eea48d3de # v5.5.2
              with:
                  fail_ci_if_error: true
                  token: ${{ secrets.CODECOV_TOKEN }}
                  verbose: true

            - name: sonarqube-scan
              if: matrix.os == 'ubuntu-latest' && matrix.python-version == inputs.target_python_version && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
              uses: SonarSource/sonarqube-scan-action@a31c9398be7ace6bbfaf30c0bd5d415f843d45e9 # v7.0.0
              env:
                  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
