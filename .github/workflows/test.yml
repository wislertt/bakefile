name: Reusable Test Workflow

on:
    workflow_call:
        inputs:
            python_versions:
                type: string
                default: "['3.10', '3.11', '3.12', '3.13', '3.14']"
                description: "JSON array of Python versions to test"
            target_python_version:
                type: string
                default: "3.14"
                description: "Python version to use for coverage and SonarQube scans"
            upload_coverage:
                type: boolean
                default: true
                description: "Whether to upload coverage reports"
        secrets:
            SONAR_TOKEN:
                required: false
            CODECOV_TOKEN:
                required: false

jobs:
    test:
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest, macos-latest]
                python-version: ${{ fromJson(inputs.python_versions) }}
        runs-on: ${{ matrix.os }}

        steps:
            - name: checkout
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  fetch-depth: 0

            # - name: setup-python
            #   uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
            #   with:
            #       python-version: ${{ matrix.python-version }}

            - name: set-dot-python-version
              run: echo "${{ matrix.python-version }}" > .python-version

            - name: setup-uv
              uses: astral-sh/setup-uv@61cb8a9741eeb8a550a1b8544337180c0fc8476b # v7.2.0
              with:
                  python-version: ${{ matrix.python-version }}
                  version: "latest"
                  enable-cache: true

            # - name: cache-uv
            #   uses: actions/cache@8b402f58fbc84540c8b491a91e594a4576fec3d7 # v5.0.2
            #   with:
            #       path: ${{ github.workspace }}/.venv
            #       key: uv-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('uv.lock') }}
            #       restore-keys: |
            #           uv-${{ runner.os }}-py${{ matrix.python-version }}-
            #           uv-${{ runner.os }}-

            # - name: set-dot-python-version
            #   run: echo "${{ matrix.python-version }}" > .python-version

            - name: install-dependencies
              run: uv sync --all-extras --all-groups --frozen

            - name: debug
              run: |
                  which python
                  python --version
                  uv run which bake
                  uv python find
                  uv run bf -vv find-python
                  $(uv python find) --version

            - name: run-tests
              run: make test

            - name: upload-coverage-reports-to-codecov
              if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
              uses: codecov/codecov-action@671740ac38dd9b0130fbe1cec585b89eea48d3de # v5.5.2
              with:
                  fail_ci_if_error: true
                  token: ${{ secrets.CODECOV_TOKEN }}
                  verbose: true

            - name: sonarqube-scan
              if: matrix.os == 'ubuntu-latest' && matrix.python-version == inputs.target_python_version && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
              uses: SonarSource/sonarqube-scan-action@a31c9398be7ace6bbfaf30c0bd5d415f843d45e9 # v7.0.0
              env:
                  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
