name: ci

on:
    pull_request:
        types: [labeled, unlabeled, opened, synchronize, reopened]

permissions:
    contents: write
    id-token: write

jobs:
    # ====================================================
    # Versioning and Release
    # ====================================================
    check-pre-release:
        name: check-pre-release
        uses: wislertt/zerv/.github/workflows/shared-check-pr-label-and-branch.yml@ddfd6483bdba16c31b97a093df8cc03cd9a95393 # v0.8.16
        with:
            target_label: "pre-release"
            branch_prefixes: '["release/"]'
            branch_names: '["develop"]'

    zerv-versioning:
        name: zerv-versioning
        needs: check-pre-release
        uses: wislertt/zerv/.github/workflows/shared-zerv-versioning.yml@ddfd6483bdba16c31b97a093df8cc03cd9a95393 # v0.8.16
        with:
            schema: >-
                ${{ (needs.check-pre-release.outputs.is_valid == 'true'
                && 'standard-base-prerelease-post')
                || 'standard-base-prerelease-post-dev' }}

    tag-pre-release:
        name: tag-pre-release
        needs: [zerv-versioning, check-pre-release]
        if: needs.check-pre-release.outputs.is_valid == 'true'
        uses: wislertt/zerv/.github/workflows/shared-create-tags.yml@ddfd6483bdba16c31b97a093df8cc03cd9a95393 # v0.8.16
        with:
            tags: '["${{ fromJson(needs.zerv-versioning.outputs.versions).v_semver }}"]'

    # ====================================================
    # Test and Lint
    # ====================================================
    test:
        uses: ./.github/workflows/test.yml
        secrets:
            SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
            CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    pre-commit:
        uses: ./.github/workflows/pre-commit.yml

    # ====================================================
    # Deployment
    # ====================================================
    publish-test-pypi:
        if: needs.check-pre-release.outputs.has_label == 'true'
        needs: [zerv-versioning, check-pre-release]
        uses: ./.github/workflows/publish.yml
        with:
            version: ${{ fromJson(needs.zerv-versioning.outputs.versions).pep440 }}
            python_version: "3.14"
            registry: test-pypi
            allow_fail: true # test-pypi is unreliable
        secrets:
            PYPI_API_TOKEN: ${{ secrets.TEST_PYPI_API_TOKEN }}
