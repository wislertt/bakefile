# managed by bakefile; edit only the parts marked "editable"
name: ci

on:
    pull_request:
        types: [opened, synchronize, reopened]

permissions:
    contents: read

concurrency:
    group: ci-caller-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    # (editable) versioning and release
    check-pre-release:
        name: check-pre-release
        permissions:
            contents: read
            pull-requests: read
        uses: wislertt/zerv/.github/workflows/shared-check-pr-label-and-branch.yml@348c40b7e38f9ac640b85919de2d45c7077f6507 # v0.8.42
        with:
            target_label: "pre-release"
            branch_prefixes: '["release/"]'
            branch_names: '["develop"]'

    zerv-versioning:
        name: zerv-versioning
        needs: check-pre-release
        uses: wislertt/zerv/.github/workflows/shared-zerv-versioning.yml@348c40b7e38f9ac640b85919de2d45c7077f6507 # v0.8.42
        with:
            schema: >-
                ${{ (needs.check-pre-release.outputs.is_valid == 'true'
                && 'standard-base-prerelease-post')
                || 'standard-base-prerelease-post-dev' }}

    tag-pre-release:
        name: tag-pre-release
        needs: [zerv-versioning, check-pre-release]
        if: needs.check-pre-release.outputs.is_valid == 'true'
        permissions:
            contents: write
        uses: wislertt/zerv/.github/workflows/shared-create-tags.yml@348c40b7e38f9ac640b85919de2d45c7077f6507 # v0.8.42
        with:
            tags: '["${{ fromJson(needs.zerv-versioning.outputs.versions).v_semver }}"]'

    # (editable) jobs
    test:
        uses: ./.github/workflows/test.yml
        secrets:
            SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
            CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    pre-commit:
        uses: ./.github/workflows/pre-commit.yml

    publish-test-pypi:
        if: needs.check-pre-release.outputs.has_label == 'true'
        needs: [zerv-versioning, check-pre-release]
        uses: ./.github/workflows/publish.yml
        with:
            version: ${{ fromJson(needs.zerv-versioning.outputs.versions).pep440 }}
            python_version: "3.15"
            registry: test-pypi
            allow_fail: true # test-pypi is unreliable
        secrets:
            PYPI_API_TOKEN: ${{ secrets.TEST_PYPI_API_TOKEN }}

    # (editable) more jobs below
