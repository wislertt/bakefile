# managed by bakefile; edit only the parts marked "editable"
name: ci

on:
    pull_request:
        types: [opened, edited, synchronize, reopened]

permissions:
    pull-requests: read

concurrency:
    group: semantic-pull-request-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    semantic-pull-request:
        name: semantic-pull-request
        runs-on: ubuntu-latest # (editable)
        timeout-minutes: 5 # (editable)
        steps:
            - name: validate-pr-title
              # (editable) pin
              uses: amannn/action-semantic-pull-request@c5e23b7e584519ee15caa684cf60d056aa9f035f # v6.1.3
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            # (editable) more steps below
