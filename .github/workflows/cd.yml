name: cd

on:
    push:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: write
    issues: write
    pull-requests: write

jobs:
    # ====================================================
    # Versioning and Release
    # ====================================================
    semantic-release:
        name: semantic-release
        uses: wislertt/zerv/.github/workflows/shared-semantic-release.yml@9d4743e3a3dade2898341dbd3baaf1762e53afbf # v0.8.29
        with:
            allowed_workflow_dispatch_branches: '["main"]'
            fail_on_invalid_workflow_dispatch_ref: true

    zerv-versioning:
        needs: semantic-release
        if: needs.semantic-release.outputs.is_valid_semantic_release == 'true'
        uses: wislertt/zerv/.github/workflows/shared-zerv-versioning.yml@9d4743e3a3dade2898341dbd3baaf1762e53afbf # v0.8.29

    create-version-prefix-tags:
        needs: zerv-versioning
        uses: wislertt/zerv/.github/workflows/shared-create-tags.yml@9d4743e3a3dade2898341dbd3baaf1762e53afbf # v0.8.29
        with:
            tags: >-
                [
                  "${{ fromJson(needs.zerv-versioning.outputs.versions).v_major }}",
                  "${{ fromJson(needs.zerv-versioning.outputs.versions).v_major_minor }}"
                ]

    # ====================================================
    # Test and Lint
    # ====================================================
    test:
        uses: ./.github/workflows/test.yml
        secrets:
            SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
            CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    pre-commit:
        uses: ./.github/workflows/pre-commit.yml

    # ====================================================
    # Deployment
    # ====================================================
    publish-pypi:
        needs: zerv-versioning
        uses: ./.github/workflows/publish.yml
        with:
            version: ${{ fromJson(needs.zerv-versioning.outputs.versions).pep440 }}
            python_version: "3.14"
            registry: pypi
        secrets:
            PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}

    publish-test-pypi:
        needs: zerv-versioning
        uses: ./.github/workflows/publish.yml
        with:
            version: ${{ fromJson(needs.zerv-versioning.outputs.versions).pep440 }}
            python_version: "3.14"
            registry: test-pypi
            allow_fail: true # test-pypi is unreliable
        secrets:
            PYPI_API_TOKEN: ${{ secrets.TEST_PYPI_API_TOKEN }}
