name: publish

on:
    workflow_call:
        inputs:
            version:
                description: "Version to publish (e.g., 0.1.0)"
                required: true
                type: string
            repository:
                description: "Repository to publish to"
                required: true
                type: string
                default: "test-pypi"

# permissions:
#     id-token: write

jobs:
    publish:
        name: publish-to-${{ inputs.repository }}
        runs-on: ubuntu-latest
        # environment:
        #     name: ${{ inputs.repository }}
        #     url: ${{ inputs.repository == 'test-pypi' && 'https://test.pypi.org/project/bakefile/' || 'https://pypi.org/project/bakefile/' }}
        permissions:
            id-token: write

        steps:
            - name: Checkout
              uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

            - name: Update version in pyproject.toml
              run: |
                  sed -i.bak 's/^version = .*/version = "${{ inputs.version }}"/' pyproject.toml
                  grep '^version' pyproject.toml

            - name: Set up Python
              uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
              with:
                  python-version: "3.14"

            - name: Install uv
              uses: astral-sh/setup-uv@681c641aba71e4a1c380be3ab5e12ad51f415867 # v7.1.6
              with:
                  version: "latest"

            - name: Build package
              run: uv build

            - name: Publish to PyPI
              uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0
              with:
                  repository-url: ${{ inputs.repository == 'test-pypi' && 'https://test.pypi.org/legacy/' || '' }}
                  verbose: true
